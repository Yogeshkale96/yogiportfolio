<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="haldi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="shadi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="recep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="640" cy="120" r="160" fill="#8b5cf6" opacity="0.25"/>
  <circle cx="160" cy="380" r="140" fill="#d946ef" opacity="0.18"/>

  <!-- Header bar -->
  <rect x="120" y="70" width="560" height="56" rx="14" fill="#0f0f1a" stroke="#ffffff20"/>
  <rect x="120" y="70" width="56" height="56" rx="14" fill="url(#accent)"/>
  <text x="148" y="105" font-family="Segoe UI, sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">📅</text>
  <text x="200" y="105" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Event Management</text>
  <rect x="560" y="86" width="100" height="24" rx="12" fill="url(#accent)"/>
  <text x="610" y="103" font-family="Segoe UI, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">+ New Event</text>

  <!-- Haldi event card -->
  <rect x="120" y="160" width="170" height="220" rx="16" fill="#0f0f1a" stroke="#ffffff20"/>
  <rect x="120" y="160" width="170" height="70" rx="16" fill="url(#haldi)"/>
  <rect x="120" y="200" width="170" height="30" fill="url(#haldi)"/>
  <text x="205" y="200" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Haldi</text>
  <circle cx="205" cy="270" r="26" fill="url(#haldi)" opacity="0.85"/>
  <text x="205" y="277" font-family="Segoe UI, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">🌼</text>
  <rect x="140" y="310" width="130" height="10" rx="5" fill="#ffffff30"/>
  <rect x="140" y="330" width="90" height="10" rx="5" fill="#ffffff20"/>
  <rect x="140" y="355" width="60" height="16" rx="8" fill="url(#haldi)"/>

  <!-- Shadi event card -->
  <rect x="315" y="160" width="170" height="220" rx="16" fill="#0f0f1a" stroke="#ffffff20"/>
  <rect x="315" y="160" width="170" height="70" rx="16" fill="url(#shadi)"/>
  <rect x="315" y="200" width="170" height="30" fill="url(#shadi)"/>
  <text x="400" y="200" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Shadi</text>
  <circle cx="400" cy="270" r="26" fill="url(#shadi)" opacity="0.85"/>
  <text x="400" y="278" font-family="Segoe UI, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">💍</text>
  <rect x="335" y="310" width="130" height="10" rx="5" fill="#ffffff30"/>
  <rect x="335" y="330" width="100" height="10" rx="5" fill="#ffffff20"/>
  <rect x="335" y="355" width="60" height="16" rx="8" fill="url(#shadi)"/>

  <!-- Reception event card -->
  <rect x="510" y="160" width="170" height="220" rx="16" fill="#0f0f1a" stroke="#ffffff20"/>
  <rect x="510" y="160" width="170" height="70" rx="16" fill="url(#recep)"/>
  <rect x="510" y="200" width="170" height="30" fill="url(#recep)"/>
  <text x="595" y="200" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Reception</text>
  <circle cx="595" cy="270" r="26" fill="url(#recep)" opacity="0.85"/>
  <text x="595" y="278" font-family="Segoe UI, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">🎉</text>
  <rect x="530" y="310" width="130" height="10" rx="5" fill="#ffffff30"/>
  <rect x="530" y="330" width="80" height="10" rx="5" fill="#ffffff20"/>
  <rect x="530" y="355" width="60" height="16" rx="8" fill="url(#recep)"/>

  <!-- Bottom stats bar -->
  <rect x="120" y="410" width="560" height="40" rx="12" fill="#0f0f1a" stroke="#ffffff20"/>
  <circle cx="160" cy="430" r="8" fill="url(#haldi)"/>
  <text x="180" y="435" font-family="Segoe UI, sans-serif" font-size="12" fill="#ffffffcc">3 Events</text>
  <circle cx="300" cy="430" r="8" fill="url(#shadi)"/>
  <text x="320" y="435" font-family="Segoe UI, sans-serif" font-size="12" fill="#ffffffcc">120 Guests</text>
  <circle cx="450" cy="430" r="8" fill="url(#recep)"/>
  <text x="470" y="435" font-family="Segoe UI, sans-serif" font-size="12" fill="#ffffffcc">Registered</text>
</svg>
