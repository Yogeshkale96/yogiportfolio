<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="dacc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="milk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e5e7eb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#dbg)"/>
  <circle cx="640" cy="120" r="160" fill="#8b5cf6" opacity="0.25"/>
  <circle cx="160" cy="380" r="140" fill="#d946ef" opacity="0.18"/>

  <!-- Milk bottle -->
  <g transform="translate(200 250)">
    <rect x="-30" y="-70" width="60" height="20" rx="4" fill="url(#dacc)"/>
    <path d="M-26 -50 L26 -50 L30 70 L-30 70 Z" fill="url(#milk)" opacity="0.9" stroke="#ffffff40"/>
    <rect x="-22" y="-10" width="44" height="40" fill="url(#milk)"/>
    <rect x="-20" y="20" width="40" height="14" rx="3" fill="url(#dacc)"/>
  </g>

  <!-- B2B badge -->
  <rect x="120" y="120" width="120" height="40" rx="20" fill="#0f0f1a" stroke="url(#dacc)"/>
  <text x="180" y="146" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">B2B</text>

  <!-- B2C badge -->
  <rect x="560" y="120" width="120" height="40" rx="20" fill="url(#dacc)"/>
  <text x="620" y="146" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">B2C</text>

  <!-- Arrows connecting -->
  <path d="M240 140 L560 140" stroke="url(#dacc)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Order cards -->
  <rect x="380" y="220" width="220" height="60" rx="12" fill="#0f0f1a" stroke="#ffffff20"/>
  <circle cx="410" cy="250" r="14" fill="url(#dacc)"/>
  <rect x="435" y="240" width="140" height="10" rx="5" fill="#ffffff30"/>
  <rect x="435" y="258" width="90" height="8" rx="4" fill="#ffffff20"/>

  <rect x="380" y="300" width="220" height="60" rx="12" fill="#0f0f1a" stroke="#ffffff20"/>
  <circle cx="410" cy="330" r="14" fill="url(#dacc)"/>
  <rect x="435" y="320" width="120" height="10" rx="5" fill="#ffffff30"/>
  <rect x="435" y="338" width="80" height="8" rx="4" fill="#ffffff20"/>

  <!-- Cart icon -->
  <g transform="translate(640 360)" fill="none" stroke="url(#dacc)" stroke-width="5" stroke-linecap="round">
    <path d="M-30 -20 L-20 -20 L-10 30 L30 30 L40 -5 L-15 -5"/>
    <circle cx="-5" cy="45" r="6" fill="url(#dacc)"/>
    <circle cx="25" cy="45" r="6" fill="url(#dacc)"/>
  </g>
</svg>
