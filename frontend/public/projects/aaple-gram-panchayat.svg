<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <circle cx="640" cy="120" r="160" fill="#8b5cf6" opacity="0.25"/>
  <circle cx="160" cy="380" r="140" fill="#d946ef" opacity="0.18"/>

  <!-- House outline -->
  <g transform="translate(400 250)">
    <path d="M-120 40 L0 -80 L120 40 L120 130 L-120 130 Z" fill="#0f0f1a" stroke="url(#accent2)" stroke-width="6"/>
    <rect x="-40" y="40" width="80" height="90" fill="url(#accent2)" opacity="0.85"/>
    <rect x="-90" y="20" width="40" height="40" fill="#ffffff14"/>
    <rect x="50" y="20" width="40" height="40" fill="#ffffff14"/>
    <rect x="-100" y="-110" width="40" height="40" fill="url(#accent2)"/>
  </g>

  <!-- Notice board -->
  <rect x="120" y="160" width="180" height="120" rx="12" fill="#0f0f1a" stroke="#ffffff20"/>
  <rect x="120" y="160" width="180" height="28" rx="12" fill="url(#accent2)"/>
  <rect x="140" y="205" width="140" height="10" rx="5" fill="#ffffff30"/>
  <rect x="140" y="225" width="100" height="10" rx="5" fill="#ffffff20"/>
  <rect x="140" y="245" width="120" height="10" rx="5" fill="#ffffff20"/>

  <!-- Service card -->
  <rect x="500" y="160" width="180" height="120" rx="12" fill="#0f0f1a" stroke="#ffffff20"/>
  <circle cx="540" cy="200" r="16" fill="url(#accent2)"/>
  <rect x="570" y="190" width="90" height="10" rx="5" fill="#ffffff30"/>
  <rect x="570" y="210" width="70" height="10" rx="5" fill="#ffffff20"/>
  <rect x="520" y="240" width="140" height="10" rx="5" fill="#ffffff20"/>
</svg>
