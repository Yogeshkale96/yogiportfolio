<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  <circle cx="640" cy="120" r="160" fill="#8b5cf6" opacity="0.25"/>
  <circle cx="160" cy="380" r="140" fill="#d946ef" opacity="0.18"/>

  <!-- Glass (cup) -->
  <g transform="translate(220 250)">
    <path d="M-40 -60 L40 -60 L30 60 L-30 60 Z" fill="#0f0f1a" stroke="url(#accent3)" stroke-width="5"/>
    <path d="M-30 -30 L30 -30 L26 40 L-26 40 Z" fill="url(#accent3)" opacity="0.6"/>
  </g>

  <!-- Plate -->
  <g transform="translate(400 260)">
    <ellipse cx="0" cy="0" rx="90" ry="30" fill="#0f0f1a" stroke="url(#accent3)" stroke-width="5"/>
    <ellipse cx="0" cy="-6" rx="70" ry="22" fill="url(#accent3)" opacity="0.5"/>
  </g>

  <!-- Box / package -->
  <g transform="translate(580 250)">
    <rect x="-50" y="-60" width="100" height="120" rx="8" fill="#0f0f1a" stroke="url(#accent3)" stroke-width="5"/>
    <line x1="-50" y1="-20" x2="50" y2="-20" stroke="url(#accent3)" stroke-width="4"/>
    <line x1="0" y1="-60" x2="0" y2="-20" stroke="url(#accent3)" stroke-width="4"/>
    <rect x="-15" y="-50" width="30" height="20" fill="url(#accent3)" opacity="0.6"/>
  </g>

  <!-- Order bar -->
  <rect x="160" y="360" width="480" height="14" rx="7" fill="#ffffff14"/>
  <rect x="160" y="360" width="320" height="14" rx="7" fill="url(#accent3)"/>
</svg>
